# =============================================================================
# contract-local.yml —— Local PR Contract Gate（Coding 仓）
# =============================================================================
#
# 目的
#   Coding 仓的 L1 Repository Contract Gate：Schema 快照一致性 → Payload 身份自洽 →
#   共享 conformance → 项目契约测试 → PR gate（含 publication safety）→ wheel smoke。
#
# 规范来源
#   Master `docs/specs/2026-09-10-dual-agent-foundation-contract-master-spec.md`
#     §15.1  L1 Repository Contract Gate：每仓独立运行、不 clone 另一仓（1550），
#            PR gate 八步（1552-1563），权威命令清单（1569-1577）
#     §15.2  跨平台 hash job：Windows 运行完整 Contract CI（1583）
#     Appendix C.2  Coding 权威命令（2391-2399）
#     Appendix C.3  wheel / package-data smoke（2414-2425）
#     Appendix C.4  CI 环境矩阵：Local PR Contract Gate = Windows / 无密钥（2429-2431）
#     Appendix F.3  `contract-local.yml`：Coding Local Gate，不 checkout Wiki（2680）
#   Spec 10 `docs/specs/foundation-contract/10-packaging-and-local-contract-ci.md`
#     Allowed Changes（41）、CI Implementation Steps（89）、
#     Development Validation Commands（97-104）、Forbidden（51/53）、
#     Acceptance（126-131）、Stop Conditions（136-140）
#
# provisional 与已知缺口（本文件不自行填补规范，只显式标注）
#   G-06  触发条件未定义：Master §15.1-§15.3 与 Appendix 全文没有给出任何 `on:` 语义；
#         本文件下方的触发集合是 provisional 推断，待 Spec 回修后收敛。同理 C.4 列出
#         6 个 job 而 Spec10:41 只允许 2 个 Coding workflow 文件：Historical replay（L2）
#         与 Fresh smoke（L3）不是 workflow，是受控手动运行，见文末注释块。
#   G-19  `python -m build` 前置的 `build` 模块（以及 `[build-system]` requires 的
#         setuptools）在 runner 上未预装 —— 本文件显式安装；不改 `pyproject.toml`。
#   G-18  脚本退出码语义全文未定义：本文件只采用"非 0 即失败"，不解释具体数字。
#         `scripts/contracts/validate_local.py` 尚未落地时 python 退出 2，该步骤照样
#         失败（Appendix C 2358：脚本缺失不得用临时命令冒充通过）。
#   G-05  §15.1:1560 的 "contract-related regression subset" 未定义；本文件不发明子集，
#         该步骤由 `validate_local.py --gate pr` 内部实现。
#   G-16  Coding 侧没有权威 expected hash 来源（§15.1:1550 禁止 clone Wiki）：本 L1 gate
#         只做**本仓自洽**校验，不做任何跨仓身份比较；跨仓比较是 §15.3 协调端职责。
#   G-07  candidate 档位的回归基线（381/13/0）与仓库现状可能冲突：本文件不运行
#         `--gate candidate`（其触发方式亦未定义，同 G-06）。
#
# 禁止事项（Master §15.1:1550；Spec10:51/53；Appendix F.3:2680）
#   1. 不得 clone 或读取另一仓（Wiki）：本 job 无跨仓 checkout / fetch / 网络拉取。
#   2. 不得调用真实模型。
#   3. 不得 dump 环境变量、凭据或 private endpoint：不运行 `env` / `Get-ChildItem Env:` /
#      `git config --list` / `printenv` 之类打印命令，不依赖 ACTIONS_STEP_DEBUG。
#   4. 不得设置或使用任何 secret：本 job 不引用 `secrets` 上下文，`permissions` 最小化。
#      （Coding 仓有 `.env.example`，本 gate 不读取、不注入任何业务密钥。）
#   5. 不上传 artifact：本 gate 只产出通过/失败，从根上避免误传环境内容。
#
# 注意
#   最后一步 `python -m build` 会在源树产生 `build/` 目录，属预期；该目录不进入
#   任何后续判定（本 workflow 无 artifact、无缓存上传）。
#   YAML 注释中出现的 `${{ ... }}` 不会被求值（注释不参与表达式展开）。
# =============================================================================

name: Contract Local Gate (Coding)

# provisional（G-06）：`on:` 全文未定义，以下为推断集合。
on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

# 最小权限（Master Appendix C.4 / Spec10:121「所有 workflows 与最小权限边界」）。
permissions:
  contents: read

jobs:
  local-contract-gate:
    name: Local PR Contract Gate (windows-latest, Python 3.12)
    # Appendix C.4:2431 —— Local PR Contract Gate 运行在 Windows，使用本仓完整/测试依赖，无密钥。
    runs-on: windows-latest
    # 显式超时，避免 CI 无限挂起（build + 两次 wheel 构建在同一 run 内）。
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      # fetch-depth: 0 —— 末档 gate 与历史相关的判定需要完整历史（此处保留全历史）。
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Coding 主依赖已含 openai / python-dotenv / langgraph / pydantic==2.13.4，
      # `dev` extra 提供 pytest，故 `-e ".[dev]"` 即覆盖 tests/contracts 的导入图
      # （agent.llm → openai；benchmark.runner → agent.issue → agent.graph → langgraph；
      # tools.report_trace / tools.tracing 的 langfuse、clickhouse-connect 均为函数内懒加载）。
      # `eval` extra（langfuse/clickhouse-connect）不在 L1 导入图内，不安装。
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      # G-19：`python -m build` 需要 `build` 模块；`tests/contracts/test_packaging.py`
      # 以 `python -m build --wheel --no-isolation` 构建 wheel，其 setuptools backend
      # 必须存在于当前环境（与 `[build-system] requires = ["setuptools>=68"]` 对齐），
      # 故显式安装两者。
      - name: Install build tooling (G-19)
        run: python -m pip install build "setuptools>=68"

      # 首次真实运行暴露的环境前置条件：`tests/test_issue_agent.py::test_auto_approve_eligible_pushes`
      # 会创建真实提交，而 GitHub runner 默认没有 git 身份 →
      # `git commit` 报 "Author identity unknown / unable to auto-detect email address"。
      # 这是环境配置（不引入任何凭据、不改变契约语义），故在 job 内显式设置。
      - name: Configure git identity for commit-creating tests
        run: |
          git config --global user.email "contract-gate@users.noreply.github.com"
          git config --global user.name "Contract Local Gate"

      # §15.1:1570 —— schema regeneration diff：快照必须与 Pydantic 重生成一致，且无工作区写入。
      - name: '[1/6] Generate schemas --check'
        run: python -m agent_core.contracts.tooling.generate_schemas --check

      # §15.1:1571 —— payload allowlist / descriptor / 无自引用 / Payload Hash（本仓自洽）。
      - name: '[2/6] Verify payload'
        run: python -m agent_core.contracts.tooling.verify_payload

      # §15.1:1572 —— shared conformance tests（两仓同源 payload 测试）。
      - name: '[3/6] Shared conformance tests'
        run: python -m pytest agent_core/contracts/conformance -q

      # §15.1:1573 —— project adapter / wiring / invariance tests。
      - name: '[4/6] Project contract tests'
        run: python -m pytest tests/contracts -q

      # §15.1:1574 —— PR gate：payload allowlist → schema diff → descriptor/hash →
      # conformance → project tests → contract-related regression subset（G-05）→
      # evidence publication safety scan → clean wheel install/import/resource smoke。
      # 该 gate 本身禁止访问另一仓（§15.1:1550）。
      - name: '[5/6] Local PR contract gate'
        run: python scripts/contracts/validate_local.py --gate pr

      # §15.1:1575 / Appendix C.3 —— package smoke；在源树产生 build/ 目录属预期。
      - name: '[6/6] Package smoke (python -m build)'
        run: python -m build

# =============================================================================
# 受控手动运行（这些**不是** workflow；G-06：Spec10:41 只允许本文件在内的 2 个
# Coding workflow 文件，L2/L3 是受控手动运行，禁止为其新增 workflow 文件）
# =============================================================================
#
# L2 —— Historical replay（Master §13.2 / Appendix C.2:2405-2407；Spec12）：
#   $env:AGENT_CONTRACT_MODE='strict'; $env:AGENT_CONTRACT_RUN_ID='<run_id>'; python scripts/contracts/replay_history.py --run-manifest config/contracts/replay-v0.1.json
#
# L3 —— Fresh smoke（Master §11.2/§13.3 / Appendix C.2:2409-2411；Spec13）：
#   $env:AGENT_CONTRACT_MODE='observe'; $env:AGENT_CONTRACT_RUN_ID='<run_id>'; python scripts/contracts/validate_local.py --gate smoke --run-manifest config/contracts/smoke-v0.1.json
#
# Appendix C.2:2406/2410 给出的示例 run_id：'foundation-0_1_0-c1-coding-replay' /
# 'foundation-0_1_0-c1-coding-smoke'。`<run_id>` 必须显式给出、与 run manifest 一致，
# 且满足 `^[A-Za-z0-9_-]+$`（EVD-RUN-001）。
#
# 另一条受控手动命令（同样不是 workflow）——Cycle Candidate Gate（§15.1:1576）：
#   python scripts/contracts/validate_local.py --gate candidate
#   其回归期望与仓库现状存在冲突（G-07），且触发方式未定义（G-06），不得自行接入 CI。
#
# 注意：Coding 仓没有 coordinator / finalizer / status ledger（Spec10:39；Master §3.2:492-495），
# 因此本仓不得出现 `contract-coordinate.yml` 或任何协调/终局 workflow。
#
# L2/L3 不得在本 workflow 内以任何形式运行：它们需要真实业务路径/模型密钥，
# 而本 job 是"无密钥 + 不调用真实模型"的 L1 gate。
# =============================================================================
