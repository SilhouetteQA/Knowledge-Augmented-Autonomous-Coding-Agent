[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-augmented-coding-agent"
version = "0.1.0"
description = "领域知识增强的自主编程 Agent：基于 LangGraph、MCP、Knowledge Graph、Docker Sandbox 与 GitHub Workflow 的 Autonomous Software Engineering Agent"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "langgraph>=1.2",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
]
eval = [
    "langfuse>=4.0",
    "clickhouse-connect>=1.7",
]

[tool.setuptools.packages.find]
# 显式声明，不依赖 setuptools flat-layout 自动发现
# （auto-discovery 会排除 tools / benchmark 等 common 名称）。
include = ["agent*", "adapters*", "agent_core*", "benchmark*", "tools*"]

# Foundation Contract Payload 非 Python 文件必须随 wheel 发布，
# 由 agent_core.contracts.tooling 与 conformance 通过 importlib.resources 读取。
[tool.setuptools.package-data]
"agent_core.contracts" = [
    "contract.md",
    "payload-descriptor.json",
    "schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: 需要 Docker 守护进程的集成测试（无 Docker 时跳过）",
    "mcp: 需要 MCP 知识服务配置（KA_KNOWLEDGE_MCP*，见 .env.example）的集成测试（无配置时跳过）",
]
